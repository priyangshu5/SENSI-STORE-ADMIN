<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Terminal - SENSI 444</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="auth-container glass metal-border">
        <img src="assets/logo.jpg" alt="Logo" class="auth-logo">
        <h2 class="form-title">ADMIN <span class="red">ACCESS</span></h2>
        <input type="email" id="admin-email" class="cyber-input" placeholder="Admin Email">
        <input type="password" id="admin-pass" class="cyber-input" placeholder="Password">
        <button id="admin-login-btn" class="btn-cyber full-width">AUTHENTICATE</button>
    </div>
    <div id="toast" class="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('admin-login-btn').addEventListener('click', () => {
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-pass').value;
            adminLogin(email, pass);
        });
    </script>
</body>
</html>
